[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acsl"
version = "0.1.0"
description = "Attention-Coupled Security Loop: a frozen-base safety-evaluation harness that gates actions on an internal security signal read and looped at a mid-network attention layer."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "ACSL research" }]
keywords = ["llm", "safety", "interpretability", "refusal", "evaluation"]

# NOTE: `torch` is intentionally listed WITHOUT a version/build pin.
# The target hardware is AMD ROCm (RX 6900 XT / gfx1030) on RHEL. Install the
# ROCm torch wheel separately *before* installing this package, e.g.:
#   pip install --index-url https://download.pytorch.org/whl/rocm6.1 torch
# Do NOT let pip pull a CUDA build over the top of a ROCm install. See README.
dependencies = [
    "torch",
    "transformers>=4.44",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "safetensors>=0.4",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
# Optional 4-bit/8-bit quantization. RDNA2 (gfx1030) needs a ROCm bitsandbytes
# build; this is an extra, never required by the core path.
quant = ["bitsandbytes"]

[project.urls]
Homepage = "https://example.invalid/acsl"

[tool.setuptools.packages.find]
where = ["."]
include = ["acsl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
